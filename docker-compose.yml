services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thingery
      POSTGRES_PASSWORD: thingery
      POSTGRES_DB: thingery
    ports:
      - "5432:5432"
    volumes:
      - thingery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thingery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thingery_pgdata:
